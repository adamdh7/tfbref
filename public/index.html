    const SUPPORTED_LANGS = ['ht', 'fr', 'en', 'es'];

    function detectLanguage() {
        const savedLang = localStorage.getItem('language');
        if (SUPPORTED_LANGS.includes(savedLang)) {
            return savedLang;
        }

        const browserLangs = Array.isArray(navigator.languages) && navigator.languages.length > 0
            ? navigator.languages
            : [navigator.language || navigator.userLanguage || ''];

        let detectedLang = 'ht';
        for (const lang of browserLangs) {
            const shortLang = String(lang || '').slice(0, 2).toLowerCase();
            if (SUPPORTED_LANGS.includes(shortLang)) {
                detectedLang = shortLang;
                break;
            }
        }

        localStorage.setItem('language', detectedLang);
        return detectedLang;
    }

    let currentLang = detectLanguage();
    
    function applyTranslations() {
        const t = tr[currentLang];
        document.querySelectorAll('[data-key]').forEach(el => {
            const k = el.dataset.key;
            if (t[k]) {
                if (el.tagName === 'INPUT') el.placeholder = t[k];
                else el.innerText = t[k];
            }
        });
        document.documentElement.lang = currentLang;
        updateDynamicTexts();
        renderSelectionMeta();
        if (uploading) updateOverall();
    }

    function setLang(lang) {
        if (lang === currentLang) {
            closeMenu();
            return;
        }
        currentLang = lang;
        localStorage.setItem('language', lang);
        applyTranslations();
        closeMenu();
    }

    function toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');

    function humanFileSize(bytes) {
      const thresh = 1024;
      if (!Number.isFinite(bytes)) return '0 B';
      if (Math.abs(bytes) < thresh) return `${Math.max(0, bytes)} B`;
      const units = ['KB','MB','GB','TB','PB','EB','ZB','YB'];
      let u = -1;
      let value = bytes;
      do {
        value /= thresh;
        ++u;
      } while (Math.abs(value) >= thresh && u < units.length - 1);
      return `${value.toFixed(1)} ${units[u]}`;
    }

    function escapeHtml(unsafe) {
      return String(unsafe)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function updateFileProgress(index, loaded, total, speed) {
        const ui = uploadStates[index];

        ui.fileProgressFill.style.width = `${percent}%`;

    function updateOverall() {
        if (!overallProgressWrap.classList.contains('hidden')) {
            const totalBytes = uploadStates.reduce((sum, item) => sum + item.total, 0);
            const loadedBytes = uploadStates.reduce((sum, item) => sum + Math.min(item.loaded, item.total || item.loaded), 0);
            const overallPercent = totalBytes ? Math.min(100, Math.round((loadedBytes / totalBytes) * 100)) : 0;
            const counts = uploadStates.reduce((acc, item) => {
                if (item.state === 'success') acc.success++;
                else if (item.state === 'error') acc.failed++;
                else if (item.state === 'cancelled') acc.cancelled++;
                else acc.active++;
                return acc;
            }, { success: 0, failed: 0, cancelled: 0, active: 0 });
            overallProgressFill.style.width = `${overallPercent}%`;
            overallPct.textContent = `${overallPercent}%`;
            overallStatusText.textContent = counts.active > 0 ? formatText('msg-running', { a: counts.active }) : counts.success === uploadStates.length ? tr[currentLang]['msg-final-ok'].replace('{s}', counts.success) : formatText('msg-summary', { s: counts.success, f: counts.failed, a: counts.cancelled });
            overallInfo.textContent = formatText('msg-bytes', { l: humanFileSize(loadedBytes), t: humanFileSize(totalBytes) });
            overallCounts.textContent = `${counts.success} ✓ · ${counts.failed} ! · ${counts.cancelled} ×`;
        }
    }

    function parseJsonResponse(text) {
        try {
            return JSON.parse(text || '{}');
        } catch (e) {
            return {};
        }
    }

    function extractServerError(data, fallback) {
        if (!data || typeof data !== 'object') return fallback;
        return data.error || data.message || data.detail || data.reason || fallback;
    }

    function makeServerError(data, fallbackCode = 'ERR_SERVER') {
        const error = new Error(extractServerError(data, fallbackCode));
        error.code = fallbackCode;
        error.serverData = data;
        return error;
    }

    function requestJson(method, endpoint, body, index) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            requests.set(index, { ...(requests.get(index) || {}), [endpoint]: xhr });
            xhr.open(method, endpoint, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.timeout = 120000;

            xhr.onload = () => {
                const current = requests.get(index) || {};
                Object.keys(current).forEach(key => {
                    if (current[key] === xhr) delete current[key];
                });
                requests.set(index, current);

                const data = parseJsonResponse(xhr.responseText);
                if (xhr.status >= 200 && xhr.status < 300) {
                    resolve(data);
                } else {
                    reject(makeServerError(data));
                }
            };

            xhr.onerror = () => {
                const current = requests.get(index) || {};
                Object.keys(current).forEach(key => {
                    if (current[key] === xhr) delete current[key];
                });
                requests.set(index, current);
                reject(Object.assign(new Error('ERR_NETWORK'), { code: 'ERR_NETWORK' }));
            };

            xhr.ontimeout = () => {
                const current = requests.get(index) || {};
                Object.keys(current).forEach(key => {
                    if (current[key] === xhr) delete current[key];
                });
                requests.set(index, current);
                reject(Object.assign(new Error('ERR_NETWORK'), { code: 'ERR_NETWORK' }));
            };

            xhr.onabort = () => {
                const current = requests.get(index) || {};
                Object.keys(current).forEach(key => {
                    if (current[key] === xhr) delete current[key];
                });
                requests.set(index, current);
                const error = new Error('ERR_ABORT');
                error.isAbort = true;
                reject(error);
            };

            try {
                xhr.send(JSON.stringify(body));
            } catch (err) {
                reject(Object.assign(new Error('ERR_GENERIC'), { code: 'ERR_GENERIC' }));
            }
        });
    }

    function getHeaderValue(headers, names) {
        if (!headers || typeof headers !== 'object') return '';
        const keys = Object.keys(headers);
        for (const wanted of names) {
            const lower = wanted.toLowerCase();
            const key = keys.find(item => item.toLowerCase() === lower);
            if (key && headers[key] != null) return String(headers[key]);
        }
        return '';
    }

    function normalizeHeaderEntries(headers) {
        if (!headers || typeof headers !== 'object') return [];
        const forbidden = new Set(['accept', 'accept-charset', 'accept-encoding', 'access-control-request-headers', 'access-control-request-method', 'connection', 'content-length', 'cookie', 'cookie2', 'date', 'dnt', 'expect', 'host', 'origin', 'referer', 'sec-fetch-dest', 'sec-fetch-mode', 'sec-fetch-site', 'te', 'trailer', 'transfer-encoding', 'upgrade', 'user-agent', 'via']);
        return Object.entries(headers).filter(([key, value]) => value != null && !forbidden.has(String(key).toLowerCase()));
    }

    function putToR2(uploadUrl, headers, file, index, onProgress) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            const current = requests.get(index) || {};
            current.upload = xhr;
            requests.set(index, current);
            xhr.open('PUT', uploadUrl, true);
            xhr.timeout = 0;

                normalizeHeaderEntries(headers).forEach(([key, value]) => {
                try {
                    xhr.setRequestHeader(key, String(value));
                } catch (e) {}
            });

            const contentTypeProvided = getHeaderValue(headers, ['Content-Type', 'content-type']);
            if (!contentTypeProvided && file.type) {
                try {
                    xhr.setRequestHeader('Content-Type', file.type);
                } catch (e) {}
            }

            const startTime = Date.now();
            xhr.upload.onprogress = (event) => {
                if (!event.lengthComputable) return;
                const elapsed = Math.max((Date.now() - startTime) / 1000, 0.001);
                const speed = event.loaded / elapsed;
                onProgress(event.loaded, event.total, speed);
            };

            xhr.onload = () => {
                const active = requests.get(index) || {};
                if (active.upload === xhr) delete active.upload;
                requests.set(index, active);
                if (xhr.status >= 200 && xhr.status < 300) {
                    resolve();
                } else {
                    const error = new Error(`R2_${xhr.status}`);
                    error.code = 'ERR_R2';
                    error.status = xhr.status;
                    reject(error);
                }
            };

            xhr.onerror = () => {
                const active = requests.get(index) || {};
                if (active.upload === xhr) delete active.upload;
                requests.set(index, active);
                const error = new Error('ERR_NETWORK');
                error.code = 'ERR_NETWORK';
                reject(error);
            };

            xhr.onabort = () => {
                const active = requests.get(index) || {};
                if (active.upload === xhr) delete active.upload;
                requests.set(index, active);
                const error = new Error('ERR_ABORT');
                error.isAbort = true;
                reject(error);
            };

            try {
                xhr.send(file);
            } catch (err) {
                reject(Object.assign(new Error('ERR_R2'), { code: 'ERR_R2' }));
            }
        });
    }

    function extractUploadPreparation(data) {
        const uploadUrl = data.uploadUrl || '';
        const uploadHeaders = data.uploadHeaders || {};
        const tfid = data.TFID || '';
        return { uploadUrl, uploadHeaders, tfid };
    }

    function extractCompletedUrls(data) {
        const urls = [];
        if (Array.isArray(data?.urls)) {
            data.urls.forEach(url => {
                if (typeof url === 'string' && url) urls.push(url);
                else if (url && typeof url === 'object') {
                    const value = url.url || url.href || url.location;
                    if (value) urls.push(String(value));
                }
            });
        }
        ['url', 'fileUrl', 'downloadUrl', 'location', 'href', 'publicUrl'].forEach(key => {
            if (typeof data?.[key] === 'string' && data[key] && !urls.includes(data[key])) urls.push(data[key]);
        });
        return urls;
    }

    function normalizeUrl(url) {
        try {
            return new URL(url, window.location.href).href;
        } catch (e) {
            return '';
        }
    }

    async function prepareUpload(file, index) {
        setFileState(index, 'preparing', 'msg-preparing');
        const data = await requestJson('POST', '/upload', {
            filename: file.name,
            size: file.size,
            contentType: file.type || 'application/octet-stream'
        }, index);
        const prepared = extractUploadPreparation(data);
        if (!prepared.uploadUrl || !prepared.tfid) {
            throw makeServerError(data, 'ERR_SERVER');
        }
        return prepared;
    }

    async function completeUpload(tfid, file, index) {
        setFileState(index, 'verifying', 'msg-verifying');
        return requestJson('POST', '/upload/complete', { TFID: tfid }, index).then(data => {
            const urls = extractCompletedUrls(data);
            if (urls.length === 0) {
                throw makeServerError(data, 'ERR_SERVER');
            }
            return urls;
        });
    }

        if (type.startsWith('image/')) {
            const wrapper = document.createElement('div');
            wrapper.className = 'mt-4 preview-frame rounded-2xl border border-gray-200 dark:border-gray-800 overflow-hidden';
            const img = document.createElement('img');
            img.src = url;
            img.alt = file.name;
            img.className = 'mx-auto max-h-72 object-contain w-full pointer-events-none';
            wrapper.appendChild(img);
            ui.fileResult.appendChild(wrapper);
        } else if (type.startsWith('video/')) {
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.preload = 'metadata';
            video.className = 'mt-4 mx-auto rounded-2xl border border-gray-200 dark:border-gray-800 max-h-72 w-full bg-black';
            ui.fileResult.appendChild(video);
        } else if (type.startsWith('audio/')) {
            const audio = document.createElement('audio');
            audio.src = url;
            audio.controls = true;
            audio.className = 'mt-4 w-full';
            ui.fileResult.appendChild(audio);
        }
    }

    function cancelSingleFile(index) {
        const current = requests.get(index);
        if (!current) return;
        let aborted = false;
        ['prepare', 'upload', 'complete', '/upload', '/upload/complete'].forEach(key => {
            const xhr = current[key];
            if (xhr) {
                try {
                    xhr.abort();
                    aborted = true;
                } catch (e) {}
            }
        });
        if (aborted) {
            setFileState(index, 'cancelled', 'msg-cancelled');
            const ui = uploadStates[index];
            if (ui) {
                ui.cancelBtn.classList.add('hidden');
                ui.fileInfo.textContent = tr[currentLang]['msg-cancelled'];
            }
        }
    }

    async function uploadSingleFile(file, index, runId) {
        const ui = uploadStates[index];
        try {
            const prepared = await prepareUpload(file, index);
            if (runId !== activeUploadRun || ui.state === 'cancelled') {
                throw Object.assign(new Error('ERR_ABORT'), { isAbort: true });
            }

            ui.cancelBtn.classList.remove('hidden');
            setFileState(index, 'uploading', 'msg-uploading');
            updateFileProgress(index, 0, file.size, 0);

            await putToR2(prepared.uploadUrl, prepared.uploadHeaders, file, index, (loaded, total, speed) => {
                if (ui.state === 'cancelled') return;
                updateFileProgress(index, loaded, total || file.size, speed);
            });

            if (ui.state === 'cancelled') {
                throw Object.assign(new Error('ERR_ABORT'), { isAbort: true });
            }

            ui.loaded = file.size;
            updateFileProgress(index, file.size, file.size, 0);

            const urls = await completeUpload(prepared.tfid, file, index);
            if (ui.state === 'cancelled') {
                throw Object.assign(new Error('ERR_ABORT'), { isAbort: true });
            }

            ui.cancelBtn.classList.add('hidden');
            setFileState(index, 'success', 'msg-completed');
            ui.fileProgressFill.style.width = '100%';
            ui.filePct.textContent = '100%';
            ui.fileInfo.textContent = tr[currentLang]['msg-completed'];
            renderUrls(ui, urls);
            renderPreview(ui, file, urls[0]);
            return { status: 'fulfilled', urls };
        } catch (err) {
            const abort = err?.isAbort || err?.name === 'AbortError' || ui.state === 'cancelled';
            ui.cancelBtn.classList.add('hidden');
            if (abort) {
                setFileState(index, 'cancelled', 'msg-cancelled');
                ui.filePct.textContent = '—';
                ui.fileInfo.textContent = tr[currentLang]['msg-cancelled'];
                return { status: 'aborted' };
            }

            let message = tr[currentLang]['msg-err-generic'];
            if (err?.code === 'ERR_NETWORK') message = tr[currentLang]['msg-err-network'];
            else if (err?.code === 'ERR_R2') message = tr[currentLang]['msg-err-r2'];
            else if (err?.code === 'ERR_SERVER') message = extractServerError(err.serverData, '') || tr[currentLang]['msg-err-server'];
            else if (err?.message && err.message !== 'ERR_GENERIC') message = err.message;

            setFileState(index, 'error', 'msg-err-generic', message);
            ui.filePct.textContent = '—';
            ui.fileInfo.textContent = message;

            const errorBox = document.createElement('div');
            errorBox.className = 'text-sm font-bold text-black dark:text-white mt-3 p-4 bg-gray-100 dark:bg-gray-800 rounded-2xl text-center border border-gray-300 dark:border-gray-700 selectable';
            errorBox.textContent = message;
            ui.fileResult.innerHTML = '';
            ui.fileResult.appendChild(errorBox);
            return { status: 'rejected', reason: err };
        } finally {
            requests.delete(index);
            updateOverall();
        }
    }

    fileInput.addEventListener('change', (e) => {
      closeMenu();
      if (hasUploaded) {
        filesArray = [];
        previewAll.innerHTML = '';
        overallProgressWrap.classList.add('hidden');
        overallProgressFill.style.width = '0%';
        overallPct.textContent = '0%';
        overallInfo.textContent = '';
        overallCounts.textContent = '';
        overallStatusText.textContent = '';
        hasUploaded = false;
      }
      const list = Array.from(e.target.files || []);
      if (!list.length) return;
      filesArray = filesArray.concat(list);
      fileInput.value = '';
      renderSelectedList();
    });

    uploadBtn.addEventListener('click', async () => {
      const t = tr[currentLang];
      if (filesArray.length === 0) {
        showToast(t['err-select']);
        return;
      }
      if (uploading) return;

      const filesToUpload = [...filesArray];
      activeUploadRun += 1;
      const runId = activeUploadRun;
      uploading = true;
      hasUploaded = false;

      uploadBtn.disabled = true;
      uploadBtn.classList.add('opacity-50', 'cursor-not-allowed');
      cancelAllBtn.classList.remove('hidden');
      fileInput.disabled = true;
      dropzoneLabel.classList.add('pointer-events-none', 'opacity-50');
      selectionMeta.classList.add('hidden');
      selectedList.innerHTML = '';
      overallProgressWrap.classList.remove('hidden');
      overallInfo.textContent = '';
      overallCounts.textContent = '';
      previewAll.innerHTML = '';
      requests.clear();

      uploadStates = filesToUpload.map((file, index) => createUploadCard(file, index));
      updateOverall();
      showToast(formatText('msg-start'));

      const uploadPromises = filesToUpload.map((file, index) => uploadSingleFile(file, index, runId));
      const results = await Promise.allSettled(uploadPromises);

      uploading = false;
      hasUploaded = true;

      uploadBtn.disabled = false;
      uploadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      cancelAllBtn.classList.add('hidden');
      fileInput.disabled = false;
      dropzoneLabel.classList.remove('pointer-events-none', 'opacity-50');
      requests.clear();
      filesArray = [];
      fileInput.value = '';

      const normalizedResults = results.map(result => result.status === 'fulfilled' ? result.value : { status: 'rejected', reason: result.reason });
      const succeeded = normalizedResults.filter(result => result.status === 'fulfilled').length;
      const aborted = normalizedResults.filter(result => result.status === 'aborted').length;
      const failed = normalizedResults.filter(result => result.status === 'rejected').length;

      const finalLoaded = uploadStates.reduce((sum, item) => sum + Math.min(item.loaded, item.total), 0);
      const finalTotal = filesToUpload.reduce((sum, file) => sum + file.size, 0);
      const finalPercent = finalTotal ? Math.round((finalLoaded / finalTotal) * 100) : 0;
      overallProgressFill.style.width = `${Math.min(100, finalPercent)}%`;
      overallPct.textContent = `${Math.min(100, finalPercent)}%`;
      overallInfo.textContent = `${humanFileSize(uploadStates.reduce((sum, item) => sum + Math.min(item.loaded, item.total), 0))} / ${humanFileSize(filesToUpload.reduce((sum, file) => sum + file.size, 0))}`;
      overallCounts.textContent = `${succeeded} ✓ · ${failed} ! · ${aborted} ×`;
      overallStatusText.textContent = failed > 0 ? formatText('msg-summary', { s: succeeded, f: failed, a: aborted }) : formatText('msg-final-ok', { s: succeeded });

      if (failed > 0) {
        showToast(formatText('msg-final-err', { s: succeeded, f: failed, a: aborted }));
      } else {
        showToast(formatText('msg-final-ok', { s: succeeded }));
      }
    });

    cancelAllBtn.addEventListener('click', () => {
      activeUploadRun += 1;
      for (const [index, current] of requests.entries()) {
        ['prepare', 'upload', 'complete', '/upload', '/upload/complete'].forEach(key => {
          const xhr = current[key];
          if (xhr) {
            try { xhr.abort(); } catch (e) {}
          }
        });
        const ui = uploadStates[index];
        if (ui && !['success', 'error', 'cancelled'].includes(ui.state)) {
            setFileState(index, 'cancelled', 'msg-cancelled');
            ui.cancelBtn.classList.add('hidden');
            ui.filePct.textContent = '—';
            ui.fileInfo.textContent = tr[currentLang]['msg-cancelled'];
        }
      }
      requests.clear();
      showToast(tr[currentLang]['msg-cancel-all']);
    });

    applyTranslations();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
