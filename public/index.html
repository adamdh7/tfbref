    const SUPPORTED_LANGS = ['ht', 'fr', 'en', 'es'];

    function detectLanguage() {
        const savedLang = localStorage.getItem('language');
        if (SUPPORTED_LANGS.includes(savedLang)) {
            return savedLang;
        }

        const browserLangs = Array.isArray(navigator.languages) && navigator.languages.length > 0
            ? navigator.languages
            : [navigator.language || navigator.userLanguage || ''];

        let detectedLang = 'ht';
        for (const lang of browserLangs) {
            const shortLang = String(lang || '').slice(0, 2).toLowerCase();
            if (SUPPORTED_LANGS.includes(shortLang)) {
                detectedLang = shortLang;
                break;
            }
        }

        localStorage.setItem('language', detectedLang);
        return detectedLang;
    }

    let currentLang = detectLanguage();
    
    function applyTranslations() {
        const t = tr[currentLang];
        document.querySelectorAll('[data-key]').forEach(el => {
            const k = el.dataset.key;
            if(t[k]) {
                if(el.tagName === 'INPUT') el.placeholder = t[k];
                else el.innerText = t[k];
            }
        });
        document.documentElement.lang = currentLang;
    }

    function setLang(lang) {
        if (lang === currentLang) {
            closeMenu();
            return;
        }
        currentLang = lang;
        localStorage.setItem('language', lang);
        applyTranslations();
        updateDynamicTexts();
        closeMenu();
    }

    function toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        if (isDark) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            localStorage.setItem('theme', 'dark');
        }
    }

    function updateToastMenuPosition(menuOpen) {
        const toast = document.getElementById('ios-toast');
        const modal = document.getElementById('settings-modal');
        if (!toast || !modal) return;

        if (!toast.classList.contains('show')) {
            toast.style.setProperty('--toast-shift-y', '0px');
            return;
        }

        if (menuOpen) {
            const rect = modal.getBoundingClientRect();
            const toastRect = toast.getBoundingClientRect();
            const currentShift = parseFloat(getComputedStyle(toast).getPropertyValue('--toast-shift-y')) || 0;
            const baseTop = toastRect.top - currentShift;
            const gap = 12;
            const targetTop = rect.top - gap - toastRect.height;
            const shift = targetTop - baseTop;
            toast.style.setProperty('--toast-shift-y', `${shift}px`);
        } else {
            toast.style.setProperty('--toast-shift-y', '0px');
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('ios-toast');
        toast.innerText = msg;
        toast.classList.add('show');
        requestAnimationFrame(() => {
            updateToastMenuPosition(document.getElementById('settings-modal').classList.contains('active'));
        });
        if (window.toastTimeout) clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => hideToast(), 3000);
    }

    function hideToast() {
        const toast = document.getElementById('ios-toast');
        toast.classList.remove('show');
        toast.style.setProperty('--toast-shift-y', '0px');
    }

    function openMenu() {
        document.body.style.overflow = 'hidden';
        const modal = document.getElementById('settings-modal');
        document.getElementById('backdrop').classList.add('active');
        modal.style.transform = '';
        modal.classList.add('active');
        const startedAt = performance.now();
        const followMenu = (now) => {
            if (!modal.classList.contains('active')) return;
            updateToastMenuPosition(true);
            if (now - startedAt < 420) requestAnimationFrame(followMenu);
        };
        requestAnimationFrame(followMenu);
    }

    function closeMenu() {
        document.body.style.overflow = '';
        document.getElementById('backdrop').classList.remove('active');
        const modal = document.getElementById('settings-modal');
        modal.classList.remove('active');
        updateToastMenuPosition(false);
        setTimeout(() => modal.style.transform = '', 350);
    }

    window.addEventListener('resize', () => {
        if (document.getElementById('settings-modal').classList.contains('active')) {
            requestAnimationFrame(() => updateToastMenuPosition(true));
        }
    });

    window.addEventListener('orientationchange', () => {
        setTimeout(() => {
            if (document.getElementById('settings-modal').classList.contains('active')) {
                updateToastMenuPosition(true);
            }
        }, 120);
    });

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            if (document.getElementById('settings-modal').classList.contains('active')) {
                requestAnimationFrame(() => updateToastMenuPosition(true));
            }
        });
    }

    let swipeModal = null;
    let startY = 0;
    let currentY = 0;

    const modalEl = document.getElementById('settings-modal');
    modalEl.addEventListener('touchstart', (e) => {
        if (modalEl.scrollTop === 0) {
            swipeModal = modalEl;
            startY = e.touches[0].clientY;
            swipeModal.style.transition = 'none';
        }
    }, {passive: true});

    modalEl.addEventListener('touchmove', (e) => {
        if (!swipeModal) return;
        currentY = e.touches[0].clientY - startY;
        if (currentY > 0) {
            swipeModal.style.transform = `translateY(${currentY}px)`;
        }
    }, {passive: true});

    modalEl.addEventListener('touchend', (e) => {
        if (!swipeModal) return;
        swipeModal.style.transition = 'transform 0.35s cubic-bezier(0.15, 0.85, 0.35, 1)';
        if (currentY > 100 || (currentY > 20 && e.changedTouches[0].clientY - startY > 50)) {
            closeMenu();
        } else {
            swipeModal.style.transform = 'translateY(0)';
        }
        swipeModal = null;
        currentY = 0;
    });

    const fileInput = document.getElementById('fileInput');
    const dropzoneLabel = document.getElementById('dropzoneLabel');
    const selectedList = document.getElementById('selectedList');
    const uploadBtn = document.getElementById('uploadBtn');
    const cancelAllBtn = document.getElementById('cancelAllBtn');
    const overallProgressWrap = document.getElementById('overallProgressWrap');
    const overallProgressFill = document.getElementById('overallProgressFill');
    const overallPct = document.getElementById('overallPct');
    const overallInfo = document.getElementById('overallInfo');
    const previewAll = document.getElementById('previewAll');

    let filesArray = [];
    let xhrs = new Map();
    let uploading = false;
    let hasUploaded = false;

    function humanFileSize(bytes) {
      const thresh = 1024;
      if (Math.abs(bytes) < thresh) return bytes + ' B';
      const units = ['KB','MB','GB','TB','PB','EB','ZB','YB'];
      let u = -1;
      do {
        bytes /= thresh;
        ++u;
      } while(Math.abs(bytes) >= thresh && u < units.length - 1);
      return bytes.toFixed(1)+' '+units[u];
    }

    function escapeHtml(unsafe) {
      return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getUIDisplayName(name) {
      if (name.length > 25) {
        return name.substring(0, 25) + '....';
      }
      return name;
    }
    
    function updateDynamicTexts() {
        const t = tr[currentLang];
        document.querySelectorAll('.btn-cancel-dynamic').forEach(btn => {
            btn.innerText = t['btn-cancel'];
        });
        document.querySelectorAll('.msg-completed-dynamic').forEach(el => {
            el.innerText = t['msg-completed'];
        });
        document.querySelectorAll('.msg-err-user-dynamic').forEach(el => {
            el.innerText = t['msg-err-user'];
        });
        document.querySelectorAll('.msg-err-net-dynamic').forEach(el => {
            el.innerText = t['msg-err-network'];
        });
        document.querySelectorAll('.msg-err-srv-dynamic').forEach(el => {
            el.innerText = t['msg-err-server'];
        });
        document.querySelectorAll('.msg-err-gen-dynamic').forEach(el => {
            el.innerText = t['msg-err-generic'];
        });
    }

    function renderSelectedList() {
      selectedList.innerHTML = '';
      if (filesArray.length === 0) return;

      const grid = document.createElement('div');
      grid.className = 'space-y-3 w-full';

      filesArray.forEach((file, idx) => {
        const row = document.createElement('div');
        row.className = 'selected-file-row flex items-center justify-between gap-3 bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 rounded-3xl p-4 w-full transition-all';

        const left = document.createElement('div');
        left.className = 'selected-file-content flex items-center gap-4 flex-1 min-w-0';

        const icon = document.createElement('div');
        icon.className = 'w-12 h-12 flex-shrink-0 rounded-2xl bg-gray-100 dark:bg-[#111111] flex items-center justify-center text-xs font-bold text-black dark:text-white uppercase tracking-wider';
        icon.textContent = file.type && file.type.startsWith('video') ? 'VID' : 'FILE';

        const titleWrap = document.createElement('div');
        titleWrap.className = 'flex-1 min-w-0 flex flex-col justify-center overflow-hidden';

        const title = document.createElement('div');
        title.className = 'file-name text-sm sm:text-base font-bold text-black dark:text-white';
        title.textContent = getUIDisplayName(file.name);

        const sub = document.createElement('div');
        sub.className = 'text-xs font-medium text-gray-500 mt-1 pointer-events-none';
        sub.textContent = `${humanFileSize(file.size)} • ${file.type || '—'}`;

        titleWrap.appendChild(title);
        titleWrap.appendChild(sub);
        left.appendChild(icon);
        left.appendChild(titleWrap);

        const right = document.createElement('div');
        right.className = 'selected-file-action flex items-center flex-shrink-0';

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.setAttribute('aria-label', 'Remove file');
        removeBtn.className = 'selected-file-remove flex items-center justify-center rounded-full bg-gray-100 dark:bg-[#111111] text-black dark:text-white hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors';
        removeBtn.innerHTML = '<svg class="selected-file-remove-icon pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M7 7L17 17M17 7L7 17"></path></svg>';
        removeBtn.onclick = () => {
          if (uploading) return;
          filesArray.splice(idx, 1);
          renderSelectedList();
        };

        right.appendChild(removeBtn);
        row.appendChild(left);
        row.appendChild(right);
        grid.appendChild(row);
      });

      selectedList.appendChild(grid);
    }

    fileInput.addEventListener('change', (e) => {
      closeMenu();
      if (hasUploaded) {
        filesArray = [];
        previewAll.innerHTML = '';
        overallProgressWrap.classList.add('hidden');
        hasUploaded = false;
      }
      const list = Array.from(e.target.files || []);
      filesArray = filesArray.concat(list);
      renderSelectedList();
    });

    uploadBtn.addEventListener('click', async () => {
      const t = tr[currentLang];
      if (filesArray.length === 0) {
        showToast(t['err-select']);
        return;
      }
      if (uploading) return;
      
      uploading = true;
      hasUploaded = false;
      
      uploadBtn.disabled = true;
      uploadBtn.classList.add('opacity-50', 'cursor-not-allowed');
      cancelAllBtn.classList.remove('hidden');
      
      fileInput.disabled = true;
      dropzoneLabel.classList.add('pointer-events-none', 'opacity-50');
      
      showToast(t['msg-start']);

      selectedList.innerHTML = ''; 
      overallProgressWrap.classList.remove('hidden');
      overallInfo.textContent = '';
      previewAll.innerHTML = '';
      xhrs.clear();

      const totalBytes = filesArray.reduce((s,f) => s + f.size, 0);
      const loadedBytes = new Array(filesArray.length).fill(0);

      const blocks = filesArray.map((file, i) => {
        const block = document.createElement('div');
        block.className = 'p-5 bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 rounded-3xl w-full transition-colors';
        block.innerHTML = `
          <div class="flex items-start justify-between gap-3 w-full min-w-0">
            <div class="flex-1 min-w-0 overflow-hidden">
              <div class="font-bold text-sm sm:text-base text-black dark:text-white file-name">${escapeHtml(getUIDisplayName(file.name))}</div>
              <div class="text-xs font-medium text-gray-500 mt-1 pointer-events-none">${humanFileSize(file.size)}</div>
            </div>
            <div class="flex-shrink-0">
              <button class="text-xs font-bold text-black dark:text-white px-4 py-2 rounded-xl bg-gray-100 dark:bg-[#111111] hover:bg-gray-200 dark:hover:bg-gray-800 hidden file-cancel transition-colors btn-cancel-dynamic">${t['btn-cancel']}</button>
            </div>
          </div>
          <div class="mt-4 pointer-events-none">
            <div class="w-full bg-gray-200 dark:bg-gray-800 rounded-full h-2 overflow-hidden">
              <div class="file-progress h-2 rounded-full transition-all bg-black dark:bg-white" style="width:0%"></div>
            </div>
            <div class="flex justify-between items-center mt-3 text-sm font-medium">
              <div class="file-pct font-mono text-black dark:text-white">0%</div>
              <div class="file-info text-gray-500"></div>
            </div>
          </div>
          <div class="mt-4 file-result w-full min-w-0 empty:hidden"></div>
        `;
        previewAll.appendChild(block);
        return {
          block,
          fileProgressFill: block.querySelector('.file-progress'),
          filePct: block.querySelector('.file-pct'),
          fileInfo: block.querySelector('.file-info'),
          fileCancelBtn: block.querySelector('.file-cancel'),
          fileResult: block.querySelector('.file-result')
        };
      });

      function updateOverall() {
        const sum = loadedBytes.reduce((a,b) => a + b, 0);
        const overallPercent = totalBytes ? Math.round((sum / totalBytes) * 100) : 0;
        overallProgressFill.style.width = overallPercent + '%';
        overallPct.textContent = overallPercent + '%';
        overallInfo.textContent = `${humanFileSize(sum)} / ${humanFileSize(totalBytes)}`;
      }

      const uploadPromises = filesArray.map((file, i) => {
        const ui = blocks[i];
        return uploadSingleFile(file, i, {
          onProgress: (loaded, total, speed, secsLeft) => {
            const percent = total ? Math.round((loaded/total)*100) : 0;
            ui.fileProgressFill.style.width = percent + '%';
            ui.filePct.textContent = percent + '%';
            ui.fileInfo.textContent = `${humanFileSize(loaded)} / ${humanFileSize(total)}`;
            loadedBytes[i] = loaded;
            updateOverall();
          },
          onXhrCreated: (xhr) => {
            xhrs.set(i, xhr);
            ui.fileCancelBtn.classList.remove('hidden');
            ui.fileCancelBtn.onclick = () => {
              try { xhr.abort(); } catch(e) {}
              showToast(tr[currentLang]['msg-err-user']);
            };
          }
        }).then(url => {
          const tLive = tr[currentLang];
          loadedBytes[i] = file.size;
          updateOverall();
          ui.fileProgressFill.style.width = '100%';
          ui.filePct.textContent = '100%';
          ui.fileInfo.textContent = tLive['msg-completed'];
          ui.fileInfo.classList.add('msg-completed-dynamic');
          ui.fileCancelBtn.classList.add('hidden');

          const match = url.match(/^(.*\/([^\/]+))\/([^\/]+)$/);
          let url1 = url;
          let url2 = url;
          let url3 = url;
          let url4 = url;
          
          if (match) {
              url2 = match[1] + '/';
              url4 = match[2];
              url3 = url2 + tLive['url-dl'];
          }
          
          const urlsToShow = [url1, url2, url3, url4];

          urlsToShow.forEach(u => {
              const div = document.createElement('div');
              div.className = 'mt-3 p-4 bg-gray-50 dark:bg-[#111111] border border-gray-200 dark:border-gray-800 rounded-2xl w-full flex items-center justify-between gap-2 file-url-container';
              const urlDiv = document.createElement('div');
              urlDiv.className = 'text-black dark:text-white text-sm font-bold flex-1 cursor-pointer transition-opacity hover:opacity-75 overflow-hidden text-ellipsis whitespace-nowrap';
              urlDiv.textContent = u;
              urlDiv.onclick = () => {
                navigator.clipboard.writeText(u).then(() => {
                  showToast(tLive['msg-copy-ok']);
                }).catch(() => {
                  showToast(tLive['msg-copy-err']);
                });
              };
              div.appendChild(urlDiv);
              ui.fileResult.appendChild(div);
          });

          const type = (file.type || '').toLowerCase();
          if (type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = url;
            img.className = 'mt-4 mx-auto rounded-2xl border border-gray-200 dark:border-gray-800 max-h-64 object-contain w-full bg-white dark:bg-black pointer-events-none';
            ui.fileResult.appendChild(img);
          } else if (type.startsWith('video/') || type.startsWith('audio/')) {
            const vid = document.createElement('video');
            vid.src = url;
            vid.controls = true;
            vid.className = 'mt-4 mx-auto rounded-2xl border border-gray-200 dark:border-gray-800 max-h-64 w-full bg-black';
            ui.fileResult.appendChild(vid);
          }
          return { status: 'fulfilled', url };
        }).catch(err => {
          ui.fileCancelBtn.classList.add('hidden');
          ui.fileInfo.textContent = '';
          ui.filePct.textContent = '—';
          ui.fileProgressFill.style.width = '0%';

          if (err && err.isAbort) {
            return { status: 'aborted' };
          }

          return { status: 'rejected', reason: err };
        });
      });

      const results = await Promise.allSettled(uploadPromises);

      uploading = false;
      hasUploaded = true;
      
      uploadBtn.disabled = false;
      uploadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      cancelAllBtn.classList.add('hidden');
      
      fileInput.disabled = false;
      dropzoneLabel.classList.remove('pointer-events-none', 'opacity-50');

      const succeeded = results.filter(r => r.status === 'fulfilled' && r.value && r.value.status === 'fulfilled').length;
      const aborted = results.filter(r => r.status === 'fulfilled' && r.value && r.value.status === 'aborted').length;
      const failed = results.filter(r => r.status === 'fulfilled' && r.value && r.value.status === 'rejected').length;
      overallInfo.textContent = `${tr[currentLang]['msg-completed']} : ${humanFileSize(loadedBytes.reduce((a,b)=>a+b,0))}`;
      
      const finalT = tr[currentLang];
      if (failed > 0) {
        const failedResult = results.find(r => r.status === 'fulfilled' && r.value && r.value.status === 'rejected');
        const failedError = failedResult && failedResult.value ? failedResult.value.reason : null;
        let errorMessage = '';

        if (failedError && failedError.message) {
          if (failedError.message.startsWith('SERVER_ERROR:')) errorMessage = failedError.message.substring(13);
          else if (failedError.message === 'ERR_NETWORK') errorMessage = finalT['msg-err-network'];
          else if (failedError.message === 'ERR_SERVER') errorMessage = finalT['msg-err-server'];
          else errorMessage = finalT['msg-err-generic'];
        } else {
          errorMessage = finalT['msg-err-generic'];
        }

        showToast(errorMessage);
      } else if (aborted > 0) {
        let txt = finalT['msg-final-err'].replace('{s}', succeeded).replace('{f}', failed).replace('{a}', aborted);
        showToast(txt);
      } else {
        let txt = finalT['msg-final-ok'].replace('{s}', succeeded);
        showToast(txt);
      }
    });

    cancelAllBtn.addEventListener('click', () => {
      for (const xhr of xhrs.values()) {
        try { xhr.abort(); } catch(e) {}
      }
      xhrs.clear();
      showToast(tr[currentLang]['msg-cancel-all']);
    });

    function uploadSingleFile(file, index, { onProgress = ()=>{}, onXhrCreated = ()=>{} } = {}) {
      return new Promise((resolve, reject) => {
        const endpoint = `/upload`;
        const confirmEndpoint = `/upload/confirm`;
        let uploadXhr = null;
        let settled = false;

        function finishReject(message, isAbort = false) {
          if (settled) return;
          settled = true;
          if (uploadXhr) xhrs.delete(index);
          const err = new Error(message);
          if (isAbort) err.isAbort = true;
          reject(err);
        }

        function finishResolve(url) {
          if (settled) return;
          settled = true;
          if (uploadXhr) xhrs.delete(index);
          resolve(url);
        }

        function responseError(xhr, fallback) {
          const statusText = String(xhr.statusText || '').trim();
          const responseText = String(xhr.responseText || '').trim();
          if (responseText) {
            try {
              const parsed = JSON.parse(responseText);
              if (parsed && parsed.error) return `SERVER_ERROR:${parsed.error}`;
            } catch (e) {}
            const messageMatch = responseText.match(/<Message>([\s\S]*?)<\/Message>/i);
            if (messageMatch && messageMatch[1]) return `SERVER_ERROR:${messageMatch[1].trim()}`;
            if (responseText.length <= 300) return `SERVER_ERROR:${responseText}`;
          }
          return `SERVER_ERROR:${fallback}${statusText ? ` (${statusText})` : ''}`;
        }

        const presignXhr = new XMLHttpRequest();
        presignXhr.open('POST', endpoint, true);
        presignXhr.setRequestHeader('Content-Type', 'application/json');

        presignXhr.onload = () => {
          let data = {};
          try {
            data = JSON.parse(presignXhr.responseText || '{}');
          } catch (e) {}

          if (presignXhr.status < 200 || presignXhr.status >= 300) {
            finishReject(data.error ? `SERVER_ERROR:${data.error}` : responseError(presignXhr, `HTTP ${presignXhr.status}`));
            return;
          }

          if (!data.uploadUrl || !data.token || !data.headers || typeof data.headers !== 'object') {
            finishReject('ERR_SERVER');
            return;
          }

          uploadXhr = new XMLHttpRequest();
          uploadXhr.open('PUT', data.uploadUrl, true);

          Object.keys(data.headers).forEach((header) => {
            const value = data.headers[header];
            if (value !== undefined && value !== null) uploadXhr.setRequestHeader(header, String(value));
          });

          let startTime = Date.now();
          uploadXhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const elapsed = (Date.now() - startTime) / 1000;
              const speed = e.loaded / Math.max(elapsed, 0.001);
              const remainingBytes = e.total - e.loaded;
              const secsLeft = Math.round(remainingBytes / Math.max(speed, 1));
              onProgress(e.loaded, e.total, speed, secsLeft);
            }
          };

          uploadXhr.onload = async () => {
            if (uploadXhr.status < 200 || uploadXhr.status >= 300) {
              finishReject(responseError(uploadXhr, `R2 PUT ${uploadXhr.status}`));
              return;
            }

            try {
              const confirmResponse = await fetch(confirmEndpoint, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token: data.token })
              });

              const confirmText = await confirmResponse.text();
              let confirmData = {};
              try {
                confirmData = JSON.parse(confirmText || '{}');
              } catch (e) {}

              if (!confirmResponse.ok) {
                const message = confirmData.error || confirmText || `HTTP ${confirmResponse.status}`;
                finishReject(`SERVER_ERROR:${message}`);
                return;
              }

              const url = confirmData.url || '';
              if (!url) {
                finishReject('ERR_SERVER');
                return;
              }

              finishResolve(url);
            } catch (error) {
              finishReject('ERR_NETWORK');
            }
          };

          uploadXhr.onerror = () => finishReject('ERR_NETWORK');

          uploadXhr.onabort = () => finishReject('ERR_ABORT', true);

          xhrs.set(index, uploadXhr);
          onXhrCreated(uploadXhr);

          try {
            uploadXhr.send(file);
          } catch (error) {
            finishReject('ERR_GENERIC');
          }
        };

        presignXhr.onerror = () => finishReject('ERR_NETWORK');

        try {
          presignXhr.send(JSON.stringify({
            filename: file.name,
            size: file.size,
            contentType: file.type || ''
          }));
        } catch (error) {
          finishReject('ERR_GENERIC');
        }
      });
    }

    applyTranslations();

  </script>
